name: netpulse_connectivity_sdk
description: >-
  Offline-first connectivity intelligence for Flutter: live network status,
  internet verification, diagnostics, quality scoring and local history.
version: 0.1.0
repository: https://github.com/iamrama/netpulse-connectivity-sdk
issue_tracker: https://github.com/iamrama/netpulse-connectivity-sdk/issues

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

topics:
  - connectivity
  - network
  - diagnostics
  - offline

screenshots:
  - description: Live network status dashboard
    path: screenshots/home.png
  - description: Network diagnostics results
    path: screenshots/diagnostics.png
  - description: Connection history timeline
    path: screenshots/history.png

flutter:
  plugin:
    platforms:
      android:
        package: io.github.iamrama.netpulse_connectivity_sdk
        pluginClass: NetpulsePlugin
      ios:
        pluginClass: NetpulsePlugin
